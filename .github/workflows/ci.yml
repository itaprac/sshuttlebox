name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        # Current macOS requires LC_UUID, which Go 1.22's internal linker omits.
        env:
          GOFLAGS: ${{ runner.os == 'macOS' && matrix.go == '1.22.x' && '-ldflags=-linkmode=external' || '' }}
        run: go test -race -cover ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ssh-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test server
        run: python -m pip install paramiko==5.0.0
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/shbx" ./cmd/shbx
      - name: Test OpenSSH password authentication and transfers
        run: python tests/integration/ssh_password.py "$RUNNER_TEMP/shbx"
