name: Deploy site to Railway

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "cmd/site/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/railway-site.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >
          railway up
          --project 2b28c65a-7680-4924-8132-7ed2458d1d63
          --environment production
          --service sshuttlebox-site
          --detach
          -m "Deploy sshuttlebox site from GitHub ${GITHUB_SHA}"
